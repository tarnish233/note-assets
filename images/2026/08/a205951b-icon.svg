<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b87a"/>
      <stop offset="100%" stop-color="#d4a06a"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 棋盘 (15x15 简化) -->
  <g transform="translate(96 96)">
    <rect width="320" height="320" rx="20" fill="url(#board)"/>
    <!-- 网格线 -->
    <g stroke="#4a3520" stroke-width="1.5" opacity="0.7">
      <line x1="20" y1="20" x2="300" y2="20"/>
      <line x1="20" y1="60" x2="300" y2="60"/>
      <line x1="20" y1="100" x2="300" y2="100"/>
      <line x1="20" y1="140" x2="300" y2="140"/>
      <line x1="20" y1="180" x2="300" y2="180"/>
      <line x1="20" y1="220" x2="300" y2="220"/>
      <line x1="20" y1="260" x2="300" y2="260"/>
      <line x1="20" y1="300" x2="300" y2="300"/>
      <line x1="20" y1="20" x2="20" y2="300"/>
      <line x1="60" y1="20" x2="60" y2="300"/>
      <line x1="100" y1="20" x2="100" y2="300"/>
      <line x1="140" y1="20" x2="140" y2="300"/>
      <line x1="180" y1="20" x2="180" y2="300"/>
      <line x1="220" y1="20" x2="220" y2="300"/>
      <line x1="260" y1="20" x2="260" y2="300"/>
      <line x1="300" y1="20" x2="300" y2="300"/>
    </g>
    <!-- 边框 -->
    <rect x="20" y="20" width="280" height="280" fill="none" stroke="#4a3520" stroke-width="3" rx="4"/>

    <!-- 布布(棕熊)棋子 - 左上 -->
    <g transform="translate(80 80)">
      <circle cx="0" cy="0" r="18" fill="#c69980" stroke="#5a3f2a" stroke-width="2"/>
      <circle cx="-6" cy="-3" r="2" fill="#1a1a1a"/>
      <circle cx="6" cy="-3" r="2" fill="#1a1a1a"/>
      <path d="M -4 5 Q -2 7 0 5 Q 2 7 4 5" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 一二(白熊)棋子 - 右下 -->
    <g transform="translate(220 220)">
      <circle cx="0" cy="0" r="18" fill="#fefcf8" stroke="#5a4a3a" stroke-width="2"/>
      <circle cx="-6" cy="-3" r="2" fill="#1a1a1a"/>
      <circle cx="6" cy="-3" r="2" fill="#1a1a1a"/>
      <path d="M -4 5 Q -2 7 0 5 Q 2 7 4 5" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 标题 -->
  <text x="256" y="465" font-family="-apple-system, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle" stroke="#5a3f2a" stroke-width="1.5" paint-order="stroke">一二布布五子棋</text>
</svg>
